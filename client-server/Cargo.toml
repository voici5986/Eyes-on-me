[package]
name = "client-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "LicenseRef-EyesOnMe-Personal-NonCommercial-Copyleft-1.0"

[dependencies]
eyes-on-me-shared = { path = "../shared" }
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
csv = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
include_dir = "0.7"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
time = { version = "0.3", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
